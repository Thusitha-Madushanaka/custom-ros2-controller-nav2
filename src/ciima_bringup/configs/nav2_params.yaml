amcl:
  ros__parameters:
    use_sim_time: True

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: fake_robot_base_link
    odom_topic: /odom
    

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: True
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      time_steps: 40
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1

      vx_max: 0.35
      vx_min: -0.35
      vy_max: 0.35
      vy_min: -0.35
      wz_max: 0.6

      ax_max: 0.8
      ax_min: -0.8
      ay_max: 0.8
      ay_min: -0.8
      az_max: 1.5

      motion_model: "Omni"
      visualize: false
      temperature: 0.3
      gamma: 0.015

      critics:
        - "ConstraintCritic"
        - "ObstaclesCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathFollowCritic"
        - "PathAlignCritic"
        - "TwirlingCritic"

      ConstraintCritic:
        enabled: true
        cost_weight: 4.0

      ObstaclesCritic:
        enabled: true
        cost_weight: 4.0
        repulsion_weight: 1.5
        critical_weight: 20.0
        collision_cost: 10000.0
        collision_margin_distance: 0.10
        near_collision_cost: 200
        inflation_radius: 0.55
        cost_power: 1

      GoalCritic:
        enabled: true
        cost_weight: 5.0
        threshold_to_consider: 1.0

      GoalAngleCritic:
        enabled: true
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PathFollowCritic:
        enabled: true
        cost_weight: 5.0
        offset_from_furthest: 6
        threshold_to_consider: 1.4

      PathAlignCritic:
        enabled: true
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5

      TwirlingCritic:
        enabled: true
        cost_weight: 5.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: odom
      robot_base_frame: fake_robot_base_link

      update_frequency: 10.0
      publish_frequency: 5.0

      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05

      footprint: "[[0.34, 0.23], [0.34, -0.23], [-0.34, -0.23], [-0.34, 0.23]]"
      footprint_padding: 0.02

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: True
          marking: True
          raytrace_max_range: 3.0
          raytrace_min_range: 0.12
          obstacle_max_range: 2.5
          obstacle_min_range: 0.12
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      robot_base_frame: fake_robot_base_link

      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.05

      footprint: "[[0.34, 0.23], [0.34, -0.23], [-0.34, -0.23], [-0.34, 0.23]]"
      footprint_padding: 0.02
      track_unknown_space: true

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: True
          marking: True
          raytrace_max_range: 3.0
          raytrace_min_range: 0.12
          obstacle_max_range: 2.5
          obstacle_min_range: 0.12
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

      always_send_full_costmap: True

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: True
    global_frame: odom
    robot_base_frame: fake_robot_base_link
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

    wait:
      plugin: "nav2_behaviors/Wait"

    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"

    max_velocity: [0.35, 0.35, 0.6]
    min_velocity: [-0.35, -0.35, -0.6]

    max_accel: [0.8, 0.8, 1.0]
    max_decel: [-0.8, -0.8, -1.0]

    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 10
    stop_on_failure: true

robot_state_publisher:
  ros__parameters:
    use_sim_time: True
